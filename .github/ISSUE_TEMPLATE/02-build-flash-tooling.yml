name: Build, flash or tooling problem
description: idf.py build fails, a flash does not take, the release pack is wrong, or a host tool (kcli, kble, kmirror, jtag_flash) misbehaves.
type: Bug
assignees:
  - jbenedictocenteno
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Before you file
      options:
        - label: I have searched the [open and closed issues](https://github.com/kodediy/KodeOS/issues?q=is%3Aissue) and found nothing that covers this.
          required: true
        - label: "I ran `git submodule update --init --recursive`, so `sdk/` (and the C5 firmware nested inside it) is at the commit this tree pins."
          required: true
        - label: The problem survives deleting `build/` and the generated `sdkconfig` (a cached value always beats a new default).
          required: true

  - type: dropdown
    id: stage
    attributes:
      label: What failed
      options:
        - Build (idf.py build)
        - Flash over serial (idf.py flash, esptool, the release pack's flash.sh)
        - Flash over JTAG (tools/jtag_flash.sh, the VS Code extension)
        - Release pipeline or CI
        - Host tool (kcli, kble, kmirror, kappdata, mkkfw)
        - Host tests (tools/host_tests.sh, tools/tool_tests.sh)
        - Layer check (tools/check_layers.sh)
        - Other
    validations:
      required: true

  - type: dropdown
    id: host_os
    attributes:
      label: Host operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: idf_version
    attributes:
      label: ESP-IDF version
      description: The output of `idf.py --version`, from the same shell that failed.
      placeholder: ESP-IDF v6.1
    validations:
      required: true

  - type: textarea
    id: revisions
    attributes:
      label: Revisions
      description: The output of `git describe --tags --always --dirty && git submodule status` at the repository root.
      render: text
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: Exactly what you ran, with every argument.
      placeholder: idf.py -p /dev/cu.usbmodem101 flash
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output. In a build log the first error matters more than the last line, so do not trim the top.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: What you already tried, whether it worked on another machine or an earlier revision, the port the board enumerated on.
