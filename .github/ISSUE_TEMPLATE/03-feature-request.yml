name: Feature request
description: Something kodeOS should do that it does not do yet.
type: Feature
assignees:
  - jbenedictocenteno
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not the solution: the best answer is often not the first one proposed. A new facade call, event, driver or Active Object is an SDK change and belongs in kode-sdk's [API proposal](https://github.com/kodediy/kode-sdk/issues/new/choose).

  - type: checkboxes
    id: checklist
    attributes:
      label: Before you file
      options:
        - label: I have searched the [open and closed issues](https://github.com/kodediy/KodeOS/issues?q=is%3Aissue) and found nothing that covers this.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
      placeholder: When I carry the board without a cable I cannot tell how much battery is left until it dies.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen. Describe the behaviour on the device - buttons, glass, console - rather than the code.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including living with it, and why they fall short.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Boot and updates (OTA, install dst=os, rescue)
        - Launcher and settings sheet
        - Apps (install, run, apps region, mailbox)
        - Console (USB or BLE)
        - Display and touch
        - Buttons and LED
        - Audio and haptics
        - Power, battery and sleep
        - Storage (microSD or internal FAT)
        - Radio (WiFi, BLE, ESP32-C5)
        - Network (HTTP, UDP, MQTT, ping)
        - Sensors (IMU, magnetometer, NFC, RFID, infrared)
        - Production test (test component=...)
        - Bench and host tools
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who is it for?
      multiple: true
      options:
        - People using the Kode Dot
        - App developers
        - Production and the bench
        - The kodeOS team
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Mock-ups, sketches, how another device does it, links.
